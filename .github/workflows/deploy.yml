name: Deploy MeetInc to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy live site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: meetinc-9072a
          workload_identity_provider: projects/802867466895/locations/global/workloadIdentityPools/meetinc-github-actions/providers/meetinc-github-actions
          service_account: meetinc-github-deploy@meetinc-9072a.iam.gserviceaccount.com

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle native notification bridge
        run: pnpm run native:bundle
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.37.0

      - name: Create MeetInc Hosting site if needed
        run: |
          if ! firebase hosting:sites:get meetinc --project meetinc-9072a --json >/dev/null 2>&1; then
            firebase hosting:sites:create meetinc --project meetinc-9072a --non-interactive
          fi

      # Firebase Hosting and Firestore remain on the no-cost plan. Cloud Functions
      # are kept out of this release because deploying/running them requires Blaze.
      - name: Deploy billing-free web app
        run: firebase deploy --only hosting:app,hosting:meetinc --project meetinc-9072a --non-interactive
